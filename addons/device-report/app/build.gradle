plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mazem3dia.devicereport'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mazem3dia.devicereport'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only, never in the APK: JUnit, and org.json's real code (Android's is a stub on the JVM).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
